[project]
name = "scout-testkit"
version = "0.1.0"
description = "Test doubles shared across Scout services, including FakeClaude"
requires-python = ">=3.12"
dependencies = ["httpx2>=2.0", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout_testkit"]
