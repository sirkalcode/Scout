[project]
name = "scout-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts for Scout services"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout_contracts"]
