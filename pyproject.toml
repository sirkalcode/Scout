[project]
name = "scout"
version = "0.1.0"
description = "Vulnerability triage assistant: workspace root"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "hypothesis>=2.0",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.11",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/gateway", "services/llm-gateway"]
# orchestrator keeps its own lockfile, so framework pins cannot affect other services.
exclude = ["services/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests/e2e"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["libs/contracts/src", "services/gateway/src", "services/orchestrator/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311"]
"tests/**" = ["S101", "S603", "S607"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["libs", "services/gateway/src", "services/llm-gateway/src"]
