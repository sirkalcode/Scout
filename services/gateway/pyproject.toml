[project]
name = "gateway"
version = "0.1.0"
description = "Public entry point: auth, rate limits, run API and streaming"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx2>=2.0",
    "pydantic-settings>=2.6",
    "scout-contracts",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.uv.sources]
scout-contracts = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket --import-mode=importlib"
