[project]
name = "llm-gateway"
version = "0.1.0"
description = "The only holder of the Claude key: budgets, retries, cost accounting and fake mode"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "anyio>=4.6",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx2>=2.0",
    "pydantic-settings>=2.6",
    "scout-contracts",
    "scout-testkit",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[tool.uv.sources]
scout-contracts = { workspace = true }
scout-testkit = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/contract"]
addopts = "--disable-socket --allow-unix-socket --import-mode=importlib"
markers = ["integration: needs a real Postgres"]
