[project]
name = "orchestrator"
version = "0.1.0"
description = "Main agent engine on LangChain and LangGraph"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.0,<3",
    "fastapi>=0.115",
    "httpx2>=2.0",
    "langchain==1.4.9",
    "langchain-anthropic==1.7.10",
    "langgraph==1.2.20",
    "pydantic-settings>=2.6",
    "scout-contracts",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.uv.sources]
scout-contracts = { path = "../../libs/contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket --import-mode=importlib"
markers = ["enable_socket: test talks only to a fake API on 127.0.0.1"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src"]
